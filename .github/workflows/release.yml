name: Publish pinned workflow images
on:
  push:
    tags: ['v*']
permissions: {contents: read, packages: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [fastp, bwamem2, markdup, bqsr, mosdepth, haplotype, genotype, filter, gatk, norm_pass, cnvkit, manta, delly, sv_consensus, arriba, star_fusion, fusion_consensus, vep, tier, annotsv, report, multiqc, happy, annovar, db_load]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: TOOL=${{ matrix.tool }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.tool }}:${{ steps.version.outputs.number }}
